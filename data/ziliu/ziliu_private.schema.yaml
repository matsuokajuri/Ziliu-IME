# Rime schema
# encoding: utf-8

# Restricted TSF fields use the same static Rime Ice dictionary and spelling
# rules, but exclude extension translators and the writable user dictionary.
__include: rime_ice.schema:/

schema:
  schema_id: ziliu_private
  name: "Ziliu private"
  version: "1.0"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@traditionalize
    - uniquifier

translator:
  enable_user_dict: false
