name: recovery-tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-capsule-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify recovery capsule failure handling
        working-directory: tools/recovery
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Verify NumPy scorer stdlib-only contracts
        working-directory: tools/compression/numpy_scorer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest test_scorer_static -v
