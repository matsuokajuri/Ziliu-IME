name: recovery-tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-capsule-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify recovery capsule failure handling
        working-directory: tools/recovery
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Verify NumPy scorer stdlib-only contracts
        working-directory: tools/compression/numpy_scorer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest test_scorer_static -v
      - name: Verify NumPy student stdlib-only contracts
        working-directory: tools/compression/numpy_student
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify cache recovery stdlib-only failure handling
        working-directory: tools/recovery/numpy_cache_primitives
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify context loop stdlib-only transactions
        working-directory: tools/compression/context_training_loop
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify local supervisor synthetic failure handling
        working-directory: tools/recovery/supervised_command
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest test_supervised_command -v
      - name: Verify one-scene streaming pilot stdlib-only contracts
        working-directory: tools/recovery/numpy_cache_primitives/streaming_pilot
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v
