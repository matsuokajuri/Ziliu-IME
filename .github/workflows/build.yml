name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2025-vs2026
    env:
      ZILIU_WINDOWS_SDK_VERSION: 10.0.26100.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore pinned WinUI packages
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'MSBuild installation not found' }
          & "$vs\MSBuild\Current\Bin\amd64\MSBuild.exe" src/settings/ZiliuSettings.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:RestoreSources=https://api.nuget.org/v3/index.json "/p:RestorePackagesPath=$env:USERPROFILE\.nuget\packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -G "Visual Studio 18 2026" -A x64
          -DZILIU_BUILD_TESTS=ON
          -DZILIU_ENABLE_RIME=OFF

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure

